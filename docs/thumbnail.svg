      <text x="376" y="500" font-size="11" font-weight="400" fill="#bff2e8">hospital-scoped sign up / sign in</text></g>
    <g><rect x="656" y="446" width="282" height="74" rx="13" fill="#ffffff" fill-opacity="0.07" stroke="#5fe0cd" stroke-opacity="0.4"/>
      <text x="676" y="476" font-size="20">📊</text><text x="706" y="474">Live clinic console</text>
      <text x="676" y="500" font-size="11" font-weight="400" fill="#bff2e8">realtime thread · payer emails · analytics</text></g>
    <g><rect x="956" y="446" width="268" height="74" rx="13" fill="#ffffff" fill-opacity="0.07" stroke="#5fe0cd" stroke-opacity="0.4"/>
      <text x="976" y="476" font-size="20">🔐</text><text x="1006" y="474">KMS-signed audit</text>
