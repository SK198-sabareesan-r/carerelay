    <path d="M982 228 H1008" stroke="#5fe0cd" stroke-width="2.5" marker-end="url(#fa)"/>
    <g><rect x="1012" y="192" width="212" height="72" rx="13" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
