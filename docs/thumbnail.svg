<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06201d"/><stop offset="0.5" stop-color="#0b3f39"/><stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="shield" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5fe0cd"/><stop offset="1" stop-color="#0f3f3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2fd9c0" stop-opacity="0.4"/><stop offset="1" stop-color="#2fd9c0" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <marker id="fa" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5fe0cd"/></marker>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="300" fill="url(#glow)"/>
  <circle cx="160" cy="650" r="220" fill="url(#glow)" opacity="0.5"/>

  <!-- ===== Header ===== -->
  <g transform="translate(56,34) scale(1.45)" filter="url(#soft)">
    <path d="M32 4 L54 12 V30 C54 46 44 56 32 60 C20 56 10 46 10 30 V12 Z" fill="url(#shield)"/>
    <path d="M32 4 L54 12 V30 C54 46 44 56 32 60" fill="#ffffff" fill-opacity="0.12"/>
    <path d="M18 33h7l3.5-9 6 18 4-13h3.5l3-6h7.5" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <text x="168" y="86" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-1">CareRelay</text>
  <text x="172" y="120" font-size="21" font-weight="500" fill="#bff2e8">Agentic prior-authorization for clinics — over WhatsApp, RCS &amp; Email</text>

  <g transform="translate(980,34)">
    <rect x="0" y="0" width="244" height="36" rx="18" fill="#ffffff" fill-opacity="0.1" stroke="#5fe0cd" stroke-opacity="0.5"/>
    <text x="122" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#d7f7f0">AWS CDS Agentic AI Hackathon 2026</text>
  </g>
