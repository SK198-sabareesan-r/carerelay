      <text x="76" y="476" font-size="20">⚖️</text><text x="106" y="474">Deterministic rules</text>
      <text x="76" y="500" font-size="11" font-weight="400" fill="#bff2e8">code decides · outcome traces to a rule</text></g>
    <g><rect x="356" y="446" width="282" height="74" rx="13" fill="#ffffff" fill-opacity="0.07" stroke="#5fe0cd" stroke-opacity="0.4"/>
