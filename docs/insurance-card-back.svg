<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1012 638" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="cardbg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a3f70"/>
      <stop offset="1" stop-color="#0f5fa8"/>
    </linearGradient>
  </defs>

  <rect x="6" y="6" width="1000" height="626" rx="36" fill="url(#cardbg2)"/>
  <rect x="6" y="6" width="1000" height="626" rx="36" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>

  <!-- magnetic stripe -->
  <rect x="6" y="56" width="1000" height="78" fill="#0a2742"/>

  <!-- signature panel -->
  <rect x="60" y="168" width="640" height="70" rx="8" fill="#f3f6fa"/>
  <text x="74" y="212" font-size="22" fill="#6b7785" font-style="italic">John A. Carter</text>
  <text x="712" y="212" font-size="14" fill="#cfe4fb">AUTHORIZED SIGNATURE</text>

  <!-- info blocks -->
  <g transform="translate(60,286)" fill="#ffffff">
    <text x="0" y="0" font-size="15" letter-spacing="2" fill="#bcd9f6">MEMBER ID</text>
    <text x="0" y="32" font-size="26" font-weight="700" font-family="Consolas,Menlo,monospace">ACM-83920145</text>

    <text x="470" y="0" font-size="15" letter-spacing="2" fill="#bcd9f6">GROUP NUMBER</text>
    <text x="470" y="32" font-size="26" font-weight="700" font-family="Consolas,Menlo,monospace">GRP-4471</text>

    <text x="0" y="86" font-size="15" letter-spacing="2" fill="#bcd9f6">PAYER ID</text>
    <text x="0" y="118" font-size="26" font-weight="700" font-family="Consolas,Menlo,monospace">60054</text>

    <text x="470" y="86" font-size="15" letter-spacing="2" fill="#bcd9f6">PLAN TYPE</text>
    <text x="470" y="118" font-size="26" font-weight="700">Preferred PPO</text>
  </g>

  <!-- claims / contact -->
  <g transform="translate(60,452)" fill="#dcebfa">
    <text x="0" y="0" font-size="16" font-weight="700" fill="#ffffff">Claims &amp; Prior Authorization</text>
    <text x="0" y="28" font-size="15">Submit claims: ACME Health, PO Box 60054, Hartford, CT 06101</text>
    <text x="0" y="54" font-size="15">Prior auth / eligibility: 1-800-ACME-HLP &#183; priorauth@acmehealth.example</text>
    <text x="0" y="80" font-size="15">EDI Payer ID: 60054 &#183; www.acmehealth.example/providers</text>
  </g>

  <text x="506" y="600" text-anchor="middle" font-size="13" fill="#9fc3e6">This card does not guarantee coverage. ACME Health &#183; Demonstration card for CareRelay testing.</text>
</svg>
